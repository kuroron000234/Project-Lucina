[project]
name = "lucina"
version = "6.0.0"
description = "Project Lucina - Living Autonomous AI Character"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "mem0ai>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
