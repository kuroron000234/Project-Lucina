# config/real.yaml — ローカル検証用ランタイム設定（タスク0〜7の手順で本採用モデルへ差し替える）
# config/default.yaml にレイヤリングされる（load_config の既定挙動）。
model:
  path: "./models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
  context_window: 8192
  n_gpu_layers: -1           # 全レイヤーGPUオフロード（RTX 4060 8GB）

memory:
  summarizer_model_path: "./models/qwen2.5-1.5b-instruct-q4_k_m.gguf"  # 検証時は同モデルで要約
  persist_directory: "./data/chroma"

drive:
  vocab_expansion:
    max_candidates: 3000   # スモーク検証用の候補数上限（正式なタスク0・選定後は 0=無制限 に戻す）

inference:
  sampling: "multinomial"
  temperature: 0.8
  seed: 42
