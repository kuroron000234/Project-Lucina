# config/candidate_elyza.yaml — タスク0 候補: Llama-3-ELYZA-JP-8B（Llama-jp系・日本語特化）
model:
  path: "./models/llama-3-elyza-jp-8b-q4_k_m.gguf"
  context_window: 8192
  n_gpu_layers: -1           # 8B Q4(4.6GB)はRTX 4060 8GBに収まる（KVキャッシュはCPU側）

memory:
  summarizer_model_path: "./models/qwen2.5-1.5b-instruct-q4_k_m.gguf"  # 要約は共通の軽量モデル
  persist_directory: "./data/chroma"

drive:
  vocab_expansion:
    max_candidates: 3000

inference:
  sampling: "multinomial"
  temperature: 0.8
  seed: 42
